function $(x){return document.getElementById(x);}

function randVid(){
	$("search").innerHTML = "";
	$("searchResults").innerHTML = "";
	let r = Math.floor(Math.random() * (oneyData.length-1) + 1);
	let ytidArr = oneyData[r][4].split(",");
	let theButton = document.createElement("button");
	$("searchResults").appendChild(theButton);
	theButton.innerHTML="<img src='https://i.ytimg.com/vi/" + ytidArr[0] + "/maxresdefault.jpg' /><br />" + oneyData[r][0] + "<br />" + oneyData[r][2] + ", " + oneyData[r][1] + "<br />" + oneyData[r][3];
	if(ytidArr.length > 1){
		theButton.onclick = function () { window.location.href="https://www.youtube.com/watch_videos?video_ids=" + oneyData[r][4]};
	}
	else{
		theButton.onclick = function () { window.location.href="https://youtu.be/" + oneyData[r][4] + "?t=1s" };
    }
}

function search() {
	$("searchResults").innerHTML = "";
	let term = $("search").value.trim().toLowerCase();
	if(term !== ""){
		for(i=0;i<oneyData.length;i++){
			if(oneyData[i][0].toLowerCase().indexOf(term) !== -1){
				let ytidArr = oneyData[i][4].split(",");
				let theButton = document.createElement("button");
				$("searchResults").appendChild(theButton);
				theButton.innerHTML="<img src='https://i.ytimg.com/vi/" + ytidArr[0] + "/maxresdefault.jpg' /><br />" + oneyData[i][0] + "<br />" + oneyData[i][2] + ", " + oneyData[i][1] + "<br />" + oneyData[i][3];
				if(ytidArr.length > 1){
					theButton.onclick = function () { window.location.href="https://www.youtube.com/watch_videos?video_ids=" + oneyData[i][4]};
				}
				else{
					theButton.onclick = function () { window.location.href="https://youtu.be/" + oneyData[i][4] + "?t=1s" };
				}
			}
		}
	}
}
